# Builds CamelusMovableRollFrame-Forever.zip and attaches it to a GitHub release.
# Runs when a version tag (e.g. v1.1) is pushed, or when a release is published on GitHub.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir -p build/CamelusMovableRollFrame
          cp CamelusMovableRollFrame.lua CamelusMovableRollFrame.toc CamelusMovableRollFrame_Wrath.toc README.md build/CamelusMovableRollFrame/
          cd build && zip -r ../CamelusMovableRollFrame-Forever.zip CamelusMovableRollFrame

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Camelus' Movable Roll Frame $TAG" \
              --notes "Download **CamelusMovableRollFrame-Forever.zip** below and unzip it into \`World of Warcraft\\Interface\\AddOns\\\`."
          fi
          gh release upload "$TAG" CamelusMovableRollFrame-Forever.zip --clobber
