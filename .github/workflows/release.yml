# Builds CamelusMovableRollFrame-vX.Y-Forever.zip and attaches it to a GitHub release.
#
# - Push to main: if the "## Version:" in the .toc file has no release yet
#   (e.g. Version 1.1 -> release v1.1), the release is created with the zip.
# - Release published on GitHub by hand: the zip is built and attached to it.
# - Run by hand from the Actions tab: same as a push to main.
name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep '^## Version:' CamelusMovableRollFrame.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')
            if [ -z "$VERSION" ]; then echo "No ## Version: in CamelusMovableRollFrame.toc"; exit 1; fi
            TAG="v$VERSION"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists. Bump ## Version: in the .toc files to make a new one."
              TAG=""
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The version must be in the file name: WoWUp uses the asset's file name as
      # the version, so a name that never changes means it never sees an update.
      - name: Build zip
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p build/CamelusMovableRollFrame
          cp CamelusMovableRollFrame.lua CamelusMovableRollFrame.toc CamelusMovableRollFrame.tga README.md build/CamelusMovableRollFrame/
          cd build && zip -r "../CamelusMovableRollFrame-$TAG-Forever.zip" CamelusMovableRollFrame

      # release.json tells addon managers such as WoWUp which game client the zip
      # is for ("forever" = WoW Forever), in the same format as the BigWigs packager.
      - name: Write release.json
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          INTERFACE=$(sed -n 's/^## Interface: *//p' CamelusMovableRollFrame.toc | tr -d '\r' | cut -d, -f1 | tr -d ' ')
          cat > release.json <<JSON
          {
            "releases": [
              {
                "name": "Camelus' Movable Roll Frame",
                "version": "$TAG",
                "filename": "CamelusMovableRollFrame-$TAG-Forever.zip",
                "nolib": false,
                "metadata": [
                  { "flavor": "forever", "interface": $INTERFACE }
                ]
              }
            ]
          }
          JSON
          python3 -m json.tool release.json

      - name: Create release and attach zip
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Camelus' Movable Roll Frame $TAG" \
              --notes "For WoW Forever. Download **CamelusMovableRollFrame-$TAG-Forever.zip** below and unzip it into your game's \`Interface\\AddOns\\\` folder. Then restart the game and type \`/rollmove\`."
          fi
          gh release upload "$TAG" "CamelusMovableRollFrame-$TAG-Forever.zip" release.json --clobber
